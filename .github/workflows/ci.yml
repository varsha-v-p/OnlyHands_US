name: Server CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Server Dependencies
        working-directory: server
        run: npm install

  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Server Dependencies
        working-directory: server
        run: npm install

      - name: Run Jest Tests
        working-directory: server
        run: npm test

      - name: Upload Test Report (HTML)
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: server/test-report/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: server/coverage/
