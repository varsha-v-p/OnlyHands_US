name: Server CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: server

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: server

      - name: Run Jest tests
        run: npm test
        working-directory: server

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: server/test-report/

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: server/coverage/
